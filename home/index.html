<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RootCat's blog.">
  <title>RootCat · Home</title>
  <link rel="preload" as="font" type="font/ttf" href="assets/fonts/lato-0.ttf" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <link rel="preload" as="image" href="house/assets/poster.webp" fetchpriority="high">
</head>
<body>
  <header class="site-header">
    <a class="site-mark" href="./" aria-label="RootCat home"><img src="assets/avatar.png" alt="RootCat's avatar" width="52" height="52"></a>
    <nav aria-label="Main navigation">
      <a href="./" aria-current="page">About</a>
      <a href="https://blog.polebug.com/">Blog</a>
      <a href="https://blog.polebug.com/archives/">Archive</a>
      <a href="https://github.com/RootCat-dev" target="_blank" rel="noopener">GitHub <span aria-hidden="true">↗</span></a>
      <button type="button" class="theme-toggle" title="Dark / light" aria-label="Toggle dark / light">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </header>
  <main class="home">
    <div class="intro-house">
    <section class="intro" aria-label="About RootCat">
      <h1 class="name">RootCat</h1>
      <p class="motto" lang="zh-CN">保持思考</p>
      <p class="hello">Hi, I'm RootCat.</p>
      <p>欢迎来到我的数字空间与个人博客。保持独立思考，探索技术与生活的无限可能。</p>
      <p>欢迎在 <a href="https://github.com/RootCat-dev" target="_blank" rel="noopener">GitHub</a> 关注我的开源项目，也可以随时通过 <a href="mailto:18726092325@163.com">邮件 (Email)</a> 与我交流探讨。</p>
      <p>欢迎常来转转，愿我们在此相遇连接。</p>
      <p class="signature">Cheers,<br>RootCat</p>
      <p class="site-stats" data-stats hidden><span data-stat="site-visitors" data-unit="visitor"></span> · <span data-stat="site-views" data-unit="view"></span></p>
    </section>
    <section class="house-section" aria-label="Companion house">
      <div class="house-frame">
        <iframe id="house" src="house/?embed" title="Companion house: overview and three floors" allow="fullscreen"></iframe>
        <script>
          // A returning visitor: the house's saved frame (house/index.html, #snapshot) behind the frame, so
          // the finished house shows even before the house page paints.
          try {
            const s = JSON.parse(localStorage.getItem('polebug-house-snapshot')), f = document.getElementById('house');
            if (s && Math.abs(s.w - f.clientWidth) <= 1 && Math.abs(s.h - f.clientHeight) <= 1 && s.dpr === devicePixelRatio) f.style.background = `url(${s.src}) 0 0 / 100% 100% no-repeat`;
          } catch { /* the poster, as usual */ }
        </script>
      </div>
    </section>
    </div>
  </main>
  <script src="count.js" defer></script>
</body>
</html>
